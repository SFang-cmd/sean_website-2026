<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Door lab · how the transition is triggered</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #e9e8e4; color: #191918; font: 13px/1.5 system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { color: #555; margin: 0 0 20px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 24px; }
  .card { background: #fff; border: 1px solid #ccc; }
  .meta { padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #555; border-top: 1px solid #ddd; }
  .meta b { color: #191918; }

  /* ---- a mini viewport ---- */
  .vp { position: relative; height: 360px; overflow: hidden; --cell: 24px;
        --bg: #fcfcfa; --fg: #191918; --muted: #6b6b68; --faint: #a3a39e; --accent: #185fa5; --accent-rgb: 24,95,165;
        --grid: rgba(128,128,128,0.13); --line: rgba(128,128,128,0.28); background: var(--bg); color: var(--fg); }
  .vp.dark { --bg: #121211; --fg: #ececea; --muted: #a0a09b; --faint: #6e6e69; --accent: #378add; --accent-rgb: 55,138,221; --grid: rgba(140,140,140,0.17); }
  .side { position: absolute; inset: 0; }
  .side.a { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: var(--cell) var(--cell); }
  .side.b { background: #f7f5f0; color: #141311; display: none; }
  .vp.dark .side.b { background: #141414; color: #ecebe7; }
  .vp.flipped .side.a { display: none; } .vp.flipped .side.b { display: block; }
  .col { position: absolute; left: 72px; right: 72px; top: 0; }
  .nav { display: flex; justify-content: space-between; align-items: baseline; padding: 48px 0 24px; }
  .nav .name { font-size: 14px; font-weight: 500; }
  .nav .links { display: flex; gap: 24px; font-size: 12px; color: var(--muted); align-items: center; }
  .nav .links span { cursor: pointer; }
  .hero { font-size: 22px; font-weight: 500; line-height: 1.35; max-width: 30ch; margin: 48px 0 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .08em; color: var(--faint); }
  .rows { margin-top: 36px; color: var(--muted); font-size: 12px; }
  .rows div { padding: 8px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .readout { position: absolute; left: 72px; bottom: 20px; }
  .readout a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .readout a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .b .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }
  .b .nav .name { font-size: 20px; }
  .b .hero { font-size: 34px; line-height: 1; max-width: 16ch; font-weight: 400; }
  .b .frames { display: flex; gap: 16px; margin-top: 28px; }
  .b .frames i { display: block; width: 120px; height: 80px; background: #3b3f46; }
  .b .frames i:nth-child(2) { background: #6b5b4a; width: 70px; } .b .frames i:nth-child(3) { background: #5c6f7a; }

  /* ---- the doors ---- */
  .door { position: absolute; width: var(--cell); height: var(--cell); cursor: pointer; z-index: 5;
          transition: transform 220ms cubic-bezier(.2,.8,.2,1), box-shadow 220ms, width 220ms, height 220ms, background-color 220ms; }
  .door::after { content: ""; position: absolute; inset: -10px; }      /* 44px hit area */
  /* 1 · loose patch */
  .door.loose { background: rgba(var(--accent-rgb), 0.12); outline: 1px solid rgba(var(--accent-rgb), 0.45); outline-offset: -1px;
                transform: rotate(-3deg) translate(1px, -1px); }
  .door.loose:hover { transform: rotate(0) translate(0, -2px); box-shadow: 0 3px 10px rgba(0,0,0,0.18); background: rgba(var(--accent-rgb), 0.22); }
  /* 2 · hole: a sliver of photograph through the grid */
  .door.hole { background: var(--photo) center / 72px 72px no-repeat; outline: 1px solid rgba(0,0,0,0.25); outline-offset: -1px; }
  .door.hole:hover { width: 72px; height: 72px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  /* 3 · both */
  .door.both { background: var(--photo) center / 72px 72px no-repeat; outline: 1px solid rgba(0,0,0,0.25); outline-offset: -1px; transform: rotate(-3deg) translate(1px,-1px); }
  .door.both:hover { width: 72px; height: 72px; transform: rotate(0) translate(0,-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  /* B mirror: a grid cell showing through the paper */
  .door.mirror { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), linear-gradient(var(--bg), var(--bg));
                 background-size: 12px 12px, 12px 12px, 100% 100%; outline: 1px solid rgba(0,0,0,0.2); outline-offset: -1px; transform: rotate(3deg) translate(-1px, 1px); }
  .door.mirror:hover { transform: rotate(0) translate(0,-2px); width: 48px; height: 48px; box-shadow: 0 3px 10px rgba(0,0,0,0.18); }
  .vp.dark .door.mirror { outline-color: rgba(255,255,255,0.25); }

  canvas.wave { position: absolute; inset: 0; z-index: 9; pointer-events: none; opacity: 0; }
  .ctl { display: flex; gap: 16px; align-items: center; margin: 0 0 18px; font: 12px ui-monospace, Menlo, monospace; color: #555; }
</style>
</head>
<body>
<div class="wrap">
  <h1>The door</h1>
  <p class="lede">how the shrink wave gets triggered · hover the door, then click it · click the door on the paper side to come back</p>
  <div class="ctl"><label><input type="checkbox" id="dark" /> dark mode</label><label>placement <select id="place"><option value="nav">next to the menu (fixed)</option><option value="hero">in the hero whitespace</option><option value="corner">bottom-right corner</option></select></label></div>
  <div class="cards" id="cards"></div>
</div>
<script>
  // A placeholder "photograph" for the hole: a little night-street abstraction drawn once.
  const photo = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 72; const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, 0, 72); g.addColorStop(0, "#1a2233"); g.addColorStop(0.55, "#2c3448"); g.addColorStop(0.56, "#15110e"); g.addColorStop(1, "#0d0a08");
    x.fillStyle = g; x.fillRect(0, 0, 72, 72);
    x.fillStyle = "#e8b46a"; x.beginPath(); x.arc(52, 22, 5, 0, 7); x.fill();
    x.fillStyle = "rgba(232,180,106,0.35)"; x.fillRect(44, 40, 16, 32);
    x.fillStyle = "#d9d4c8"; x.fillRect(20, 44, 3, 20);
    return `url(${c.toDataURL()})`;
  })();

  const DOORS = [
    { key: "loose", name: "1 · loose patch", desc: "One grid cell, 3° askew and a pixel off its lines, faint accent fill. Hover squares it up and lifts it. Click runs the wave from it." },
    { key: "hole",  name: "2 · hole in the page", desc: "One grid cell containing a sliver of a photograph: the other side showing through. Hover grows it to 3×3 cells. Click runs the wave from it." },
    { key: "both",  name: "3 · both", desc: "Askew and a photo. The tilt is what makes you look; the photo is what tells you what it is." },
    { key: "text",  name: "4 · text door (footer readout)", desc: "No patch; the VLM caption line in the footer gains a linked line. Cheap and on-voice, but not physical. Could coexist with any of the above." },
  ];

  const nav = (door) => `
    <div class="col">
      <div class="nav"><span class="name">Sean Fang</span><span class="links"><span>about</span><span>experience</span><span>projects</span><span>contact</span></span></div>
      <p class="hero">I build machine learning models and the systems that run them at scale. <span class="mono">t=0</span></p>
      <div class="rows"><div><span>Google · Vision models for YouTube</span><span class="mono">2026</span></div><div><span>Anthropic · Claude Campus Ambassador</span><span class="mono">2025–26</span></div></div>
    </div>
    <div class="readout mono">&gt; tag: here to do cool things. [0.98]${door === "text" ? `<br>&gt; also: <a class="go" data-go="b">photographer</a> [0.97]` : ""}</div>`;
  const bside = `
    <div class="col">
      <div class="nav"><span class="name serif">Sean Fang</span><span class="links"><span>Gallery</span><span>Work with me</span></span></div>
      <p class="hero serif">The rest of the time I do the looking myself.</p>
      <div class="frames"><i></i><i></i><i></i></div>
    </div>
    <div class="readout mono">engineering →</div>`;

  const PLACES = {   // door position, grid-aligned (multiples of 24), per placement option
    nav:    { left: "calc(100% - 48px)", top: "48px" },          // right of the menu, in the margin
    hero:   { left: "432px", top: "144px" },                     // whitespace to the right of the hero line
    corner: { left: "calc(100% - 72px)", top: "calc(100% - 72px)" },
  };

  const cards = DOORS.map((d) => {
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div class="vp"><div class="side a">${nav(d.key)}${d.key === "text" ? "" : `<div class="door ${d.key}" data-go="b" title="photography"></div>`}</div>
                    <div class="side b">${bside}<div class="door mirror" data-go="a" title="engineering"></div></div>
                    <canvas class="wave"></canvas></div><div class="meta"><b>${d.name}</b><br>${d.desc}</div>`;
    document.getElementById("cards").appendChild(el);
    const vp = el.querySelector(".vp"); vp.style.setProperty("--photo", photo);
    return { el, vp, key: d.key };
  });

  function place() {
    const p = PLACES[document.getElementById("place").value];
    document.querySelectorAll(".door").forEach((d) => { d.style.left = p.left; d.style.top = p.top; });
  }
  document.getElementById("place").onchange = place; place();
  document.getElementById("dark").onchange = (e) => cards.forEach((c) => c.vp.classList.toggle("dark", e.target.checked));

  // The shrink wave, solid tiles (as in 3-flipdot-wave): departing bg tiles shrink to a point
  // over the arriving bg, rippling from the click point; then the sides swap.
  const CELL = 24, MS_PER_CELL = 13, TILE_MS = 320;
  function wave(vp, cx, cy, toB) {
    const canvas = vp.querySelector("canvas.wave"), ctx = canvas.getContext("2d");
    const W = vp.clientWidth, H = vp.clientHeight, dpr = devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cs = getComputedStyle(vp), dark = vp.classList.contains("dark");
    const aBg = cs.getPropertyValue("--bg").trim(), bBg = dark ? "#141414" : "#f7f5f0";
    const from = toB ? aBg : bBg, to = toB ? bBg : aBg, flash = toB ? (dark ? "#ecebe7" : "#141311") : cs.getPropertyValue("--accent").trim();
    const cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL), ci = cx / CELL, cj = cy / CELL;
    const delays = new Float32Array(cols * rows); let maxD = 0;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const d = Math.hypot(i + .5 - ci, j + .5 - cj) + Math.random(); delays[j * cols + i] = d * MS_PER_CELL; maxD = Math.max(maxD, d); }
    const total = maxD * MS_PER_CELL + TILE_MS, t0 = performance.now();
    canvas.style.opacity = 1;
    (function frame(now) {
      const t = now - t0; ctx.clearRect(0, 0, W, H);
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const lt = (t - delays[j * cols + i]) / TILE_MS; if (lt <= 0) continue;
        const x = i * CELL, y = j * CELL;
        ctx.fillStyle = to; ctx.fillRect(x, y, CELL, CELL);
        if (lt >= 1) continue;
        const k = Math.max(0, 1 - lt), s = CELL * k;
        ctx.fillStyle = from; ctx.fillRect(x + (CELL - s) / 2, y + (CELL - s) / 2, s, s);
        if (lt > 0.8) { ctx.globalAlpha = (lt - 0.8) / 0.2; ctx.fillStyle = flash; ctx.fillRect(x + CELL / 2 - 1.5, y + CELL / 2 - 1.5, 3, 3); ctx.globalAlpha = 1; }
      }
      if (t < total) requestAnimationFrame(frame);
      else { vp.classList.toggle("flipped", toB); canvas.style.transition = "opacity 250ms"; canvas.style.opacity = 0; setTimeout(() => canvas.style.transition = "", 260); }
    })(t0);
  }
  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]"); if (!go) return;
    const vp = go.closest(".vp"), r = vp.getBoundingClientRect(), g = go.getBoundingClientRect();
    wave(vp, g.left + g.width / 2 - r.left, g.top + g.height / 2 - r.top, go.dataset.go === "b");
  });
</script>
</body>
</html>
