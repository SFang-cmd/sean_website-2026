<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paper lab · why the two sides differ in color</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #e9e8e4; color: #191918; font: 13px/1.5 system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { color: #555; margin: 0 0 16px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 0 0 18px; font: 12px ui-monospace, Menlo, monospace; color: #555; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 24px; align-items: start; }
  .card { background: #fff; border: 1px solid #ccc; }
  .meta { padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #555; border-top: 1px solid #ddd; }
  .meta b { color: #191918; }

  .vp { position: relative; height: 380px; overflow: hidden; --cell: 24px;
        --bg: #fcfcfa; --fg: #191918; --muted: #6b6b68; --faint: #a3a39e; --accent: #185fa5; --accent-rgb: 24,95,165;
        --grid: rgba(128,128,128,0.13); --line: rgba(128,128,128,0.28); background: var(--bg); color: var(--fg);
        --paper: #f7f5f0; --ink: #141311; --pmuted: #6e6a62; }
  .vp.dark { --bg: #121211; --fg: #ececea; --muted: #a0a09b; --faint: #6e6e69; --accent: #378add; --accent-rgb: 55,138,221; --grid: rgba(140,140,140,0.17);
             --paper: #141414; --ink: #ecebe7; --pmuted: #9a978f; }
  .side { position: absolute; inset: 0; }
  .side.a { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: var(--cell) var(--cell); }
  .side.b { background: var(--paper); color: var(--ink); display: none; }
  .vp.flipped .side.a { display: none; } .vp.flipped .side.b { display: block; }
  .col { position: absolute; left: 56px; right: 56px; top: 0; }
  .nav { display: flex; justify-content: space-between; align-items: baseline; height: 24px; margin-top: 36px; }
  .nav .name { font-size: 14px; font-weight: 500; white-space: nowrap; }
  .nav .links { display: flex; gap: 20px; font-size: 12px; color: var(--muted); align-items: baseline; }
  .door { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 16px; color: var(--fg); cursor: pointer; }
  .hero { font-size: 20px; font-weight: 500; line-height: 1.35; max-width: 30ch; margin: 40px 0 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .08em; color: var(--faint); }
  .rows { margin-top: 28px; color: var(--muted); font-size: 12px; }
  .rows div { padding: 8px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .b .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }
  .b .nav .name { font-size: 19px; }
  .b .nav .links { color: var(--pmuted); }
  .b .hero { font-size: 32px; line-height: 1.02; max-width: 16ch; font-weight: 400; margin-top: 36px; }
  .b .sub { color: var(--pmuted); margin: 10px 0 0; font-size: 12px; max-width: 40ch; }
  .b .frames { display: flex; gap: 14px; margin-top: 22px; align-items: flex-start; }
  .b .frames i { display: block; background: #3b3f46; }
  .b .frames i:nth-child(1) { width: 150px; height: 100px; background: linear-gradient(160deg, #2a3140, #4a5668); }
  .b .frames i:nth-child(2) { width: 84px; height: 105px; background: linear-gradient(160deg, #6b5b4a, #8a7a66); }
  .b .frames i:nth-child(3) { width: 150px; height: 100px; background: linear-gradient(160deg, #5c6f7a, #8aa0ac); }
  .b .readout { position: absolute; left: 56px; bottom: 16px; cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .08em; color: var(--pmuted); }
  /* 2 · print convention: paper margin around each photo, faint lamp vignette */
  .print .frames i { padding: 0; box-shadow: 0 0 0 6px var(--paper), 0 0 0 7px rgba(0,0,0,0.08), 0 2px 10px rgba(0,0,0,0.10); margin: 7px; }
  .print .side.b::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 70% at 30% 20%, transparent 50%, rgba(60,40,20,0.06) 100%); }
  .vp.dark.print .side.b::after { background: radial-gradient(ellipse 80% 70% at 30% 20%, transparent 50%, rgba(0,0,0,0.35) 100%); }
  canvas.wave { position: absolute; inset: 0; z-index: 9; pointer-events: none; opacity: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Why the two sides differ in color</h1>
  <p class="lede">click “off the clock” to run the wave (with the halo tint) into each variant · click “engineering →” to come back · compare how intentional the color change feels</p>
  <div class="ctl">
    <label>halo <input type="range" id="halo" min="0" max="30" value="10" /><span id="haloV">0.10</span></label>
    <label><input type="checkbox" id="dark" /> dark mode</label>
  </div>
  <div class="cards" id="cards"></div>
</div>
<script>
  const CARDS = [
    { key:"0", name:"0 · as shipped: off-white", paper:"#f7f5f0", dark:"#141414", hero:"The rest of the time I do the looking myself.", sub:"Photographer, Philadelphia and New York.",
      desc:"Current values. A is #fcfcfa, B is #f7f5f0: close enough to read as a mismatch." },
    { key:"1a", name:"1a · after hours: cream", paper:"#f0ebe2", dark:"#141414", hero:"After hours the light changes.", sub:"Photographer, Philadelphia and New York. Night, street, and from the air.",
      desc:"Story 1. The engineering side is daylight; off the clock is warmer light on paper. Cream #f0ebe2 (L≈93 vs A's ≈99)." },
    { key:"1b", name:"1b · after hours: warm cream", paper:"#ebe3d4", dark:"#171512", hero:"After hours the light changes.", sub:"Photographer, Philadelphia and New York. Night, street, and from the air.",
      desc:"Same story, pushed further: #ebe3d4. Dark mode goes a touch warm too (#171512). Check it doesn't tip into beige." },
    { key:"2", name:"2 · print convention on cream", paper:"#f0ebe2", dark:"#141414", print:true, hero:"The rest of the time I do the looking myself.", sub:"Photographer, Philadelphia and New York.",
      desc:"Story 2, no words: each photo sits in a paper margin like a print, and a faint lamp vignette falls off toward the corners. White = screen, cream = paper, self-evidently." },
    { key:"2b", name:"2b · print convention on off-white", paper:"#f7f5f0", dark:"#141414", print:true, hero:"The rest of the time I do the looking myself.", sub:"Photographer, Philadelphia and New York.",
      desc:"Story 2 with the current paper: does the print framing alone make the small color difference read as intended?" },
    { key:"12", name:"1+2 · after hours, printed", paper:"#f0ebe2", dark:"#141414", print:true, hero:"After hours the light changes.", sub:"Photographer, Philadelphia and New York. Night, street, and from the air.",
      desc:"Both: the line and the physical convention." },
  ];
  const aSide = `
    <div class="col">
      <div class="nav"><span class="name">Sean Fang</span><span class="links"><span>about</span><span>experience</span><span>projects</span><span>contact</span><span class="door" data-go="b">off the clock</span></span></div>
      <p class="hero">I build machine learning models and the systems that run them at scale. <span class="mono">t=0</span></p>
      <div class="rows"><div><span>Google · Vision models for YouTube</span><span class="mono">2026</span></div><div><span>Anthropic · Claude Campus Ambassador</span><span class="mono">2025–26</span></div><div><span>UPenn PRONTO Lab · Computer vision research</span><span class="mono">2025</span></div></div>
    </div>`;
  const bSide = (c) => `
    <div class="col">
      <div class="nav"><span class="name serif">Sean Fang</span><span class="links"><span>Gallery</span><span>Work with me</span></span></div>
      <p class="hero serif">${c.hero}</p>
      <p class="sub">${c.sub}</p>
      <div class="frames"><i></i><i></i><i></i></div>
    </div>
    <div class="readout" data-go="a">engineering →</div>`;

  const cards = CARDS.map((c) => {
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div class="vp ${c.print ? "print" : ""}"><div class="side a">${aSide}</div><div class="side b">${bSide(c)}</div><canvas class="wave"></canvas></div>
      <div class="meta"><b>${c.name}</b><br>${c.desc}</div>`;
    document.getElementById("cards").appendChild(el);
    const vp = el.querySelector(".vp");
    const applyPaper = () => { const dark = vp.classList.contains("dark"); vp.style.setProperty("--paper", dark ? c.dark : c.paper); };
    applyPaper();
    return { vp, applyPaper };
  });
  document.getElementById("dark").onchange = (e) => cards.forEach((c) => { c.vp.classList.toggle("dark", e.target.checked); c.applyPaper(); });
  document.getElementById("halo").oninput = (e) => document.getElementById("haloV").textContent = (+e.target.value / 100).toFixed(2);

  // The shrink wave as on the site: departing-bg tiles shrink over the arriving bg,
  // each cell haloed in the arriving side's signature color while it shrinks,
  // dot flash at the point. Solid tiles here (no DOM clone), the content is covered.
  const CELL = 24, MS_PER_CELL = 12, TILE_MS = 320;
  function wave(vp, cx, cy, toB) {
    const canvas = vp.querySelector("canvas.wave"), ctx = canvas.getContext("2d");
    const W = vp.clientWidth, H = vp.clientHeight, dpr = devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cs = getComputedStyle(vp);
    const aBg = cs.getPropertyValue("--bg").trim(), bBg = cs.getPropertyValue("--paper").trim();
    const from = toB ? aBg : bBg, to = toB ? bBg : aBg;
    const sig = toB ? cs.getPropertyValue("--ink").trim() : cs.getPropertyValue("--accent").trim();
    const halo = +document.getElementById("halo").value / 100;
    const cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL), ci = cx / CELL, cj = cy / CELL;
    const delays = new Float32Array(cols * rows); let maxD = 0;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const d = Math.hypot(i + .5 - ci, j + .5 - cj) + Math.random(); delays[j * cols + i] = d * MS_PER_CELL; maxD = Math.max(maxD, d); }
    const total = maxD * MS_PER_CELL + TILE_MS, t0 = performance.now();
    canvas.style.opacity = 1;
    (function frame(now) {
      const t = now - t0; ctx.clearRect(0, 0, W, H);
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const lt = (t - delays[j * cols + i]) / TILE_MS; if (lt <= 0) continue;
        const x = i * CELL, y = j * CELL;
        ctx.globalAlpha = 1; ctx.fillStyle = to; ctx.fillRect(x, y, CELL, CELL);
        if (lt < 1) {
          ctx.globalAlpha = halo * (1 - lt * lt); ctx.fillStyle = sig; ctx.fillRect(x, y, CELL, CELL);
          const k = 1 - (1 - (1 - lt) * (1 - lt)); const s = CELL * (1 - (1 - (1 - lt) * (1 - lt)));
          ctx.globalAlpha = 1; ctx.fillStyle = from; ctx.fillRect(x + (CELL - s) / 2, y + (CELL - s) / 2, s, s);
        }
        if (lt >= 0.7 && lt <= 1.3) { ctx.globalAlpha = 1 - Math.abs(lt - 1) / 0.3; ctx.fillStyle = sig; ctx.fillRect(x + CELL / 2 - 1.5, y + CELL / 2 - 1.5, 3, 3); }
      }
      ctx.globalAlpha = 1;
      if (t < total) requestAnimationFrame(frame);
      else { vp.classList.toggle("flipped", toB); canvas.style.transition = "opacity 250ms"; canvas.style.opacity = 0; setTimeout(() => canvas.style.transition = "", 260); }
    })(t0);
  }
  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]"); if (!go) return;
    const vp = go.closest(".vp"), r = vp.getBoundingClientRect(), g = go.getBoundingClientRect();
    wave(vp, g.left + g.width / 2 - r.left, g.top + g.height / 2 - r.top, go.dataset.go === "b");
  });
</script>
</body>
</html>
